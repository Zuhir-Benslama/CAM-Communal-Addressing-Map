name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Releases are built straight from tags, so run the same quality gates the
  # main CI enforces before anything ships.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 2>/dev/null || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy app gui layer mixins constants.py

      - name: Run tests with coverage gate (80%)
        env:
          CAM_JWT_SECRET: test-secret-key-for-testing-only
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest test/
          --ignore=test/test_qgis_environment.py
          --cov --cov-report=term-missing -v

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build plugin ZIP
        run: |
          mkdir -p dist
          rm -rf staging/CAM
          mkdir -p staging/CAM
          cp __init__.py constants.py resources.py metadata.txt staging/CAM/
          for dir in mixins gui layer scripts resources templates data icons i18n style template_data app; do
            cp -R "$dir" staging/CAM/
          done
          find staging/CAM -name __pycache__ -type d -exec rm -rf {} +
          find staging/CAM -name '*.pyc' -delete
          (cd staging && zip -9r ../dist/CAM.zip CAM)

      - name: Compute SHA1
        run: echo "SHA1=$(sha1sum dist/CAM.zip | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CAM.zip
          body: |
            ## CAM ${{ github.ref_name }}

            **SHA1:** `${{ env.SHA1 }}`

            ### Install
            1. Download `CAM.zip`
            2. Open QGIS → **Plugins** → **Manage and Install Plugins**
            3. Select **Install from ZIP**
            4. Choose the downloaded file
            5. Restart QGIS

            Works on Windows, macOS, and Linux.
          # generate_release_notes: true  # requires GITHUB_TOKEN with release note API access