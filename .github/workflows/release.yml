name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build plugin ZIP
        run: |
          mkdir -p dist
          rm -rf staging/RNA
          mkdir -p staging/RNA
          cp __init__.py constants.py resources.py metadata.txt staging/RNA/
          for dir in mixins gui layer scripts resources templates data icons i18n style template_data app; do
            cp -R "$dir" staging/RNA/
          done
          find staging/RNA -name __pycache__ -type d -exec rm -rf {} +
          find staging/RNA -name '*.pyc' -delete
          (cd staging && zip -9r ../dist/RNA.zip RNA)

      - name: Compute SHA1
        run: echo "SHA1=$(sha1sum dist/RNA.zip | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RNA.zip
          body: |
            ## RNA ${{ github.ref_name }}

            **SHA1:** `${{ env.SHA1 }}`

            ### Install
            1. Download `RNA.zip`
            2. Open QGIS → **Plugins** → **Manage and Install Plugins**
            3. Select **Install from ZIP**
            4. Choose the downloaded file
            5. Restart QGIS

            Works on Windows, macOS, and Linux.
          # generate_release_notes: true  # requires GITHUB_TOKEN with release note API access
