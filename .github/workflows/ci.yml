name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 2>/dev/null || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy pyqt6 2>/dev/null || true

      - name: Lint with ruff
        run: |
          ruff check --select=E,W,F,I,UP app/ gui/ layer/ mixins/

      - name: Type check with mypy
        run: |
          mypy app/ gui/ layer/ mixins/ 2>/dev/null || true

      - name: Run tests
        env:
          RNA_JWT_SECRET: test-secret-key-for-testing-only
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest test/ --ignore=test/test_qgis_environment.py --ignore=test/test_translations.py -v
