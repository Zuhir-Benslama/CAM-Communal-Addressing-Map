name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pycodestyle mypy

      - name: Lint with pycodestyle
        run: |
          pycodestyle --max-line-length=80 --select=E501,W291 app/ --exclude=app/orders/models.py

      - name: Type check with mypy
        run: |
          mypy app/ --ignore-missing-imports --follow-imports=skip 2>/dev/null || true

      - name: Run tests
        env:
          RNA_JWT_SECRET: test-secret-key-for-testing-only
        run: python -m pytest test/test_db_ops.py test/test_operations.py test/test_auth.py -v
