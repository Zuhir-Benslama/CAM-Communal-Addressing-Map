name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    # The repo root ships an __init__.py (required for QGIS to load the
    # plugin directory as a package), so tooling that derives module names
    # from the filesystem (mypy) needs the checkout to live under a valid
    # package name instead of the hyphenated repository name.
    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 2>/dev/null || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy app gui layer mixins constants.py

      - name: Run tests with coverage gate (80%)
        env:
          CAM_JWT_SECRET: test-secret-key-for-testing-only
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest test/
          --ignore=test/test_qgis_environment.py
          --cov --cov-report=term-missing -v

  qgis-tests:
    # Exercises the test harness against a real QGIS installation
    # (test_qgis_environment.py is excluded from the mocked main job).
    # Runs in the official qgis Docker image rather than apt, whose QGIS
    # package is unreliable on ubuntu-latest. release-3_36 is the newest
    # published tag; bump it when newer official images appear.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run QGIS integration tests (docker)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e QT_QPA_PLATFORM \
            qgis/qgis:release-3_36 \
            bash -lc 'python3 -m pip install --break-system-packages pytest 2>/dev/null || python3 -m pip install pytest; python3 -m pytest test/test_qgis_environment.py -v'
